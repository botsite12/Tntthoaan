<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | TNTT Hòa An</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;600;800;900&family=Dancing+Script:wght@700&display=swap" rel="stylesheet">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --gold: #FFD700;
            --gold-light: #FFED4A;
            --gold-dark: #B8860B;
            --purple: #8B5CF6;
            --pink: #EC4899;
            --blue: #3B82F6;
            --green: #10B981;
            --red: #EF4444;
            --dark: #0F0F1A;
            --darker: #1A1A2E;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
            --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            --glass-blur: blur(20px);
            --radius-sm: 20px;
            --radius-md: 30px;
            --radius-lg: 40px;
            --transition: 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(135deg, #0F0F1A 0%, #1A1A2E 25%, #16213E 50%, #0F3460 75%, #533483 100%);
            color: white;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
            opacity: 0;
            animation: bodyFadeIn 1s ease forwards;
        }

        @keyframes bodyFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(139, 92, 246, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 50% 80%, rgba(59, 130, 246, 0.3) 0%, transparent 50%);
            z-index: -2;
            animation: gradientShift 8s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        /* ========== PAGE TRANSITION ========== */
        .page-transition {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99998;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }
        .page-transition.active {
            opacity: 1;
            visibility: visible;
        }
        .page-transition-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--gold), var(--purple));
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0);
            animation: circleGrow 1s ease forwards;
            box-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
        }
        @keyframes circleGrow {
            0% { transform: translate(-50%, -50%) scale(0); }
            100% { transform: translate(-50%, -50%) scale(50); }
        }

        /* ========== PRELOADER ========== */
        #preloader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #0F0F1A, #1A1A2E, #16213E);
            z-index: 99999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            cursor: pointer;
            transition: opacity 0.8s ease, visibility 0.8s;
        }
        #preloader.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .loader-rings {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 30px;
        }
        .loader-ring {
            position: absolute;
            border-radius: 50%;
            border: 3px solid transparent;
            animation: ringSpin 2s linear infinite;
        }
        .loader-ring:nth-child(1) {
            inset: 0;
            border-top-color: var(--gold);
            border-bottom-color: var(--gold);
            animation-duration: 1.5s;
        }
        .loader-ring:nth-child(2) {
            inset: 15px;
            border-left-color: var(--purple);
            border-right-color: var(--purple);
            animation-duration: 2s;
            animation-direction: reverse;
        }
        .loader-ring:nth-child(3) {
            inset: 30px;
            border-top-color: var(--pink);
            border-bottom-color: var(--pink);
            animation-duration: 2.5s;
        }
        @keyframes ringSpin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loader-center {
            position: absolute;
            inset: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            color: var(--gold);
            animation: centerPulse 1s infinite;
        }
        @keyframes centerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }
        .loader-text {
            font-family: 'Dancing Script', cursive;
            font-size: 3rem;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 20px;
        }
        .loader-bar-bg {
            width: 300px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 20px;
        }
        .loader-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), var(--purple), var(--pink));
            border-radius: 10px;
            transition: width 0.3s;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
        }
        .loader-percentage {
            font-size: 2rem;
            font-weight: 900;
            color: var(--gold);
            margin-bottom: 20px;
        }
        .loader-hint {
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
            animation: blink 1.5s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        /* ========== WELCOME OVERLAY ========== */
        .welcome-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99997;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            animation: welcomeFade 2s ease forwards;
            pointer-events: none;
        }
        @keyframes welcomeFade {
            0% { opacity: 0; }
            20% { opacity: 1; }
            80% { opacity: 1; }
            100% { opacity: 0; }
        }
        .welcome-content {
            text-align: center;
            animation: welcomeScale 2s ease forwards;
        }
        @keyframes welcomeScale {
            0% { transform: scale(0.5); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .welcome-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: welcomeIcon 1s ease infinite;
        }
        @keyframes welcomeIcon {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        .welcome-title {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
            margin-bottom: 15px;
            letter-spacing: 2px;
        }
        .welcome-subtitle {
            font-size: 3.5rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--pink), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 50px rgba(255, 215, 0, 0.5);
            letter-spacing: 3px;
        }

        /* ========== VICTORY OVERLAY ========== */
        .victory-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 99997;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            animation: victoryFade 2.5s ease forwards;
            pointer-events: none;
        }
        @keyframes victoryFade {
            0% { opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }
        .victory-content {
            text-align: center;
            animation: victoryScale 2.5s ease forwards;
        }
        @keyframes victoryScale {
            0% { transform: scale(0.3) rotate(-10deg); }
            50% { transform: scale(1.2) rotate(5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }
        .victory-icon {
            font-size: 6rem;
            margin-bottom: 20px;
            animation: victoryBounce 0.5s ease infinite;
        }
        @keyframes victoryBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-30px) scale(1.2); }
        }
        .victory-title {
            font-size: 3rem;
            font-weight: 900;
            color: var(--gold);
            text-shadow: 0 0 40px rgba(255, 215, 0, 0.9);
            margin-bottom: 15px;
            letter-spacing: 3px;
        }
        .victory-subtitle {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--green), var(--blue), var(--purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-shadow: 0 0 40px rgba(16, 185, 129, 0.5);
            letter-spacing: 2px;
        }

        /* ========== VICTORY PARTICLES ========== */
        .victory-particle {
            position: fixed;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            animation: victoryParticleFly 2s ease forwards;
            z-index: 99996;
            pointer-events: none;
        }
        @keyframes victoryParticleFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
        }

        /* ========== PARTICLES ========== */
        .particle {
            position: fixed;
            width: 4px;
            height: 4px;
            background: var(--gold);
            border-radius: 50%;
            animation: floatParticle 10s infinite;
            z-index: -1;
            box-shadow: 0 0 10px var(--gold);
        }
        @keyframes floatParticle {
            0%, 100% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { transform: translateY(-100px) rotate(180deg); opacity: 1; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            animation: containerSlideIn 1s ease;
        }
        @keyframes containerSlideIn {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ========== HEADER ========== */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 40px;
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            animation: headerGlow 3s ease infinite;
        }
        @keyframes headerGlow {
            0%, 100% { box-shadow: var(--glass-shadow); }
            50% { box-shadow: 0 8px 32px rgba(255, 215, 0, 0.3); }
        }
        .header h1 {
            font-size: 3rem;
            font-weight: 900;
            background: linear-gradient(135deg, var(--gold-light), var(--gold), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .connection-status {
            display: inline-block;
            padding: 8px 15px;
            border-radius: 25px;
            font-size: 0.9rem;
            margin-left: 10px;
        }
        .connection-status.online {
            background: rgba(16, 185, 129, 0.2);
            color: var(--green);
            border: 1px solid var(--green);
        }
        .connection-status.offline {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
            border: 1px solid var(--red);
        }

        /* ========== LOGIN ========== */
        .login-box {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: 50px;
            text-align: center;
            box-shadow: var(--glass-shadow);
            max-width: 500px;
            margin: 0 auto;
            animation: loginSlideIn 1s ease;
        }
        @keyframes loginSlideIn {
            from { opacity: 0; transform: translateY(50px) scale(0.9); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .login-box h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 2rem;
        }
        .login-box input {
            width: 100%;
            padding: 18px;
            margin: 15px 0;
            border-radius: var(--radius-sm);
            border: 2px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1.1rem;
            transition: var(--transition);
        }
        .login-box input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(1.02);
        }
        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        /* ========== BUTTONS ========== */
        .btn {
            padding: 18px 35px;
            border-radius: 50px;
            font-weight: 800;
            border: none;
            cursor: pointer;
            font-size: 1rem;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            position: relative;
            overflow: hidden;
            letter-spacing: 0.5px;
        }
        .btn::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }
        .btn:hover::after {
            width: 300px;
            height: 300px;
        }
        .btn-gold {
            background: linear-gradient(135deg, var(--gold-light), var(--gold));
            color: var(--dark);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.4);
        }
        .btn-gold:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 25px 50px rgba(255, 215, 0, 0.6);
        }
        .btn-purple {
            background: linear-gradient(135deg, var(--purple), var(--pink));
            color: white;
            box-shadow: 0 15px 35px rgba(139, 92, 246, 0.4);
        }
        .btn-purple:hover {
            transform: translateY(-3px) scale(1.05);
        }
        .btn-danger {
            background: linear-gradient(135deg, var(--red), #DC2626);
            color: white;
            padding: 12px 20px;
            border-radius: 15px;
            border: none;
            cursor: pointer;
            transition: var(--transition);
        }
        .btn-danger:hover {
            transform: scale(1.1);
            box-shadow: 0 10px 30px rgba(239, 68, 68, 0.4);
        }

        /* ========== ADMIN PANEL ========== */
        .admin-panel {
            display: none;
            animation: panelReveal 1s ease;
        }
        .admin-panel.active {
            display: block;
        }
        @keyframes panelReveal {
            from { opacity: 0; transform: translateY(30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ========== TABS ========== */
        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .tab-btn {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 18px 35px;
            border-radius: 50px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 800;
            font-size: 1.1rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            box-shadow: var(--glass-shadow);
            position: relative;
            overflow: hidden;
        }
        .tab-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        .tab-btn:hover::before {
            left: 100%;
        }
        .tab-btn.active {
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            color: var(--dark);
            border-color: var(--gold);
            box-shadow: 0 15px 35px rgba(255, 215, 0, 0.5);
            transform: scale(1.05);
        }
        .tab-content {
            display: none;
            animation: tabFadeIn 0.6s ease;
        }
        .tab-content.active {
            display: block;
        }
        @keyframes tabFadeIn {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ========== FORMS ========== */
        .form-container {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: var(--glass-shadow);
        }
        .form-container h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: var(--gold);
            font-weight: 800;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-size: 1rem;
            transition: var(--transition);
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.3);
            transform: scale(1.02);
        }
        .form-group select option {
            background: var(--darker);
            color: white;
        }
        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            margin-top: 15px;
            display: none;
            border: 2px solid var(--glass-border);
        }

        /* ========== LISTS ========== */
        .list-container h2 {
            color: var(--gold);
            margin-bottom: 20px;
            font-size: 1.8rem;
        }
        .list-item {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-sm);
            padding: 25px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 25px;
            transition: var(--transition);
            box-shadow: var(--glass-shadow);
            animation: itemSlideIn 0.5s ease;
        }
        @keyframes itemSlideIn {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .list-item:hover {
            transform: translateX(10px);
            border-color: var(--gold);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .list-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: var(--radius-sm);
            border: 2px solid var(--glass-border);
        }
        .list-item-icon {
            width: 100px;
            height: 100px;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            flex-shrink: 0;
        }
        .list-item-info {
            flex: 1;
        }
        .list-item-info h3 {
            color: var(--gold);
            margin-bottom: 10px;
        }
        .list-item-info p {
            color: rgba(255, 255, 255, 0.8);
            margin-bottom: 8px;
            font-size: 0.95rem;
        }
        .list-item-info a {
            color: var(--blue);
            text-decoration: none;
        }
        .list-item-info a:hover {
            color: var(--gold);
            text-decoration: underline;
        }
        .type-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 800;
            margin-bottom: 10px;
        }
        .type-badge.post {
            background: rgba(59, 130, 246, 0.2);
            color: var(--blue);
            border: 1px solid var(--blue);
        }
        .type-badge.video {
            background: rgba(239, 68, 68, 0.2);
            color: var(--red);
            border: 1px solid var(--red);
        }

        /* ========== STATUS ========== */
        .status-message {
            padding: 18px;
            border-radius: var(--radius-sm);
            margin-top: 20px;
            display: none;
            font-weight: 600;
            animation: statusPop 0.5s ease;
        }
        @keyframes statusPop {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        .status-message.success {
            background: rgba(16, 185, 129, 0.2);
            border: 2px solid var(--green);
            color: var(--green);
            display: block;
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.3);
        }
        .status-message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 2px solid var(--red);
            color: var(--red);
            display: block;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.3);
        }

        .logout-btn {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            cursor: pointer;
            margin-top: 30px;
            transition: var(--transition);
            font-weight: 700;
        }
        .logout-btn:hover {
            background: rgba(239, 68, 68, 0.3);
            border-color: var(--red);
        }

        .back-link {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            display: inline-block;
            margin-top: 30px;
            transition: var(--transition);
            font-weight: 600;
        }
        .back-link:hover {
            color: var(--gold);
            transform: translateX(-5px);
        }

        @media (max-width: 768px) {
            .list-item {
                flex-direction: column;
                text-align: center;
            }
            .list-item img {
                width: 100%;
                height: 200px;
            }
            .tabs {
                flex-direction: column;
            }
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <!-- PAGE TRANSITION -->
    <div class="page-transition" id="pageTransition">
        <div class="page-transition-circle"></div>
    </div>

    <!-- PRELOADER -->
    <div id="preloader" onclick="enterSite()">
        <div class="loader-rings">
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-ring"></div>
            <div class="loader-center"><i class="fas fa-crown"></i></div>
        </div>
        <div class="loader-text">Admin </div>
        <div class="loader-bar-bg"><div class="loader-bar" id="loaderBar"></div></div>
        <div class="loader-percentage" id="loaderPercentage">0%</div>
        <div class="loader-hint">👆 BẤM ĐỂ VÀO TRANG</div>
    </div>

    <!-- Floating Particles -->
    <div class="particle" style="top: 10%; left: 5%; animation-delay: 0s;"></div>
    <div class="particle" style="top: 60%; left: 10%; animation-delay: 2s;"></div>
    <div class="particle" style="top: 30%; right: 5%; animation-delay: 4s;"></div>
    <div class="particle" style="bottom: 10%; right: 10%; animation-delay: 6s;"></div>
    <div class="particle" style="top: 70%; left: 50%; animation-delay: 8s;"></div>

    <div class="container">
        <div class="header">
            <h1>👑 Admin </h1>
            <p>Thiếu Nhi Thánh Thể Giáo Xứ Hòa An <span class="connection-status offline" id="connectionStatus">Offline</span></p>
        </div>

        <!-- LOGIN -->
        <div class="login-box" id="loginBox">
            <h2>🔐 Đăng Nhập</h2>
            <input type="password" id="password" placeholder="Nhập mật khẩu..." onkeypress="if(event.key==='Enter') login()" onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')">
            <button class="btn btn-gold" onclick="login()" onmouseenter="playMemeSound('hover')">
                <i class="fas fa-key"></i> Mở Khóa
            </button>
            <div class="status-message" id="loginStatus"></div>
        </div>

        <!-- ADMIN PANEL -->
        <div class="admin-panel" id="adminPanel">
            <!-- TABS -->
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('events')" id="tabEvents" onmouseenter="playMemeSound('hover')">
                    <i class="fas fa-calendar-alt"></i> Sự Kiện
                </button>
                <button class="tab-btn" onclick="switchTab('news')" id="tabNews" onmouseenter="playMemeSound('hover')">
                    <i class="fab fa-facebook"></i> Bản Tin
                </button>
            </div>

            <!-- TAB SỰ KIỆN -->
            <div class="tab-content active" id="contentEvents">
                <div class="form-container">
                    <h2>➕ Thêm Sự Kiện</h2>
                    <div class="form-group">
                        <label>📝 Tên sự kiện:</label>
                        <input type="text" id="eventName" placeholder="VD: Khai Giảng Năm Học Mới" onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')">
                    </div>
                    <div class="form-group">
                        <label>📅 Ngày:</label>
                        <input type="date" id="eventDate" onfocus="playMemeSound('focus')" onchange="playMemeSound('click')">
                    </div>
                    <div class="form-group">
                        <label>⏰ Giờ:</label>
                        <input type="time" id="eventTime" onfocus="playMemeSound('focus')" onchange="playMemeSound('click')">
                    </div>
                    <div class="form-group">
                        <label>📍 Địa điểm:</label>
                        <input type="text" id="eventLocation" placeholder="VD: Nhà thờ Giáo xứ Hòa An" onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')">
                    </div>
                    <div class="form-group">
                        <label>📄 Mô tả:</label>
                        <textarea id="eventDescription" rows="4" placeholder="Mô tả..." onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')"></textarea>
                    </div>
                    <div class="form-group">
                        <label>🖼️ Link ảnh:</label>
                        <input type="url" id="eventImage" placeholder="https://..." onchange="previewEventImage()" onfocus="playMemeSound('focus')">
                        <img id="eventImagePreview" class="image-preview" alt="Preview">
                    </div>
                    <div class="form-group">
                        <label>📤 Tải ảnh:</label>
                        <input type="file" id="eventImageFile" accept="image/*" onchange="uploadEventImage()">
                    </div>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <button class="btn btn-gold" onclick="saveEvent()" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                        <button class="btn btn-purple" onclick="resetEventForm()" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                    <div class="status-message" id="eventStatus"></div>
                </div>
                <div class="list-container">
                    <h2>📋 Sự Kiện Đã Lưu</h2>
                    <div id="savedEvents"></div>
                </div>
            </div>

            <!-- TAB BẢN TIN -->
            <div class="tab-content" id="contentNews">
                <div class="form-container">
                    <h2>➕ Thêm Bản Tin</h2>
                    <div class="form-group">
                        <label>📝 Tiêu đề:</label>
                        <input type="text" id="newsTitle" placeholder="VD: Thông báo..." onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')">
                    </div>
                    <div class="form-group">
                        <label>📂 Loại:</label>
                        <select id="newsType" onchange="playMemeSound('click')">
                            <option value="post">Bài viết Facebook</option>
                            <option value="video">Video Facebook</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🔗 Link Facebook:</label>
                        <input type="url" id="newsLink" placeholder="https://www.facebook.com/..." onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')">
                    </div>
                    <div class="form-group">
                        <label>📄 Mô tả:</label>
                        <textarea id="newsDescription" rows="3" placeholder="Mô tả..." onfocus="playMemeSound('focus')" onkeydown="playMemeSound('type')"></textarea>
                    </div>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap;">
                        <button class="btn btn-gold" onclick="saveNews()" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-save"></i> Lưu
                        </button>
                        <button class="btn btn-purple" onclick="resetNewsForm()" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-redo"></i> Reset
                        </button>
                    </div>
                    <div class="status-message" id="newsStatus"></div>
                </div>
                <div class="list-container">
                    <h2>📋 Bản Tin Đã Lưu</h2>
                    <div id="savedNews"></div>
                </div>
            </div>

            <!-- LOGOUT -->
            <div style="text-align: center; margin-top: 30px;">
                <button class="logout-btn" onclick="logout()" onmouseenter="playMemeSound('hover')">
                    <i class="fas fa-sign-out-alt"></i> Đăng Xuất
                </button>
            </div>
        </div>

        <a href="index.html" class="back-link" onclick="transitionToPage(event, 'index.html')" onmouseenter="playMemeSound('hover')">
            <i class="fas fa-arrow-left"></i> Quay lại trang chính
        </a>
    </div>

    <script>
        // ========== FIREBASE ==========
        const firebaseConfig = {
            apiKey: "AIzaSyATNeLyDKlyeZgpJ0NdtmraAaOq6F8CrrA",
            authDomain: "tntthoaan2.firebaseapp.com",
            databaseURL: "https://tntthoaan2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tntthoaan2",
            storageBucket: "tntthoaan2.firebasestorage.app",
            messagingSenderId: "643181042469",
            appId: "1:643181042469:web:f31dd1c3be290477fc98cc"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_PASS = "hoaan2024";
        let isLoggedIn = false;

        // ========== SINGLE SESSION ==========
        let currentSessionKey = null;

        function generateSessionKey() {
            return 'session_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
        }

        function getSessionKey() {
            let key = localStorage.getItem('tntt_session_key');
            if (!key) {
                key = generateSessionKey();
                localStorage.setItem('tntt_session_key', key);
            }
            return key;
        }

        function setupSingleSession() {
            const sessionKey = getSessionKey();
            
            database.ref('admin_session').on('value', (snapshot) => {
                const sessionData = snapshot.val();
                
                if (!sessionData) return;
                
                if (sessionData.key !== sessionKey && sessionData.isLoggedIn) {
                    if (isLoggedIn) {
                        forceLogout('Phiên đăng nhập của bạn đã bị thay thế bởi thiết bị khác!');
                    }
                }
            });
            
            window.addEventListener('beforeunload', () => {
                if (currentSessionKey) {
                    database.ref('admin_session').remove();
                }
            });
        }

        function loginToSession() {
            const sessionKey = getSessionKey();
            currentSessionKey = sessionKey;
            
            database.ref('admin_session').set({
                key: sessionKey,
                isLoggedIn: true,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
        }

        function logoutFromSession() {
            if (currentSessionKey) {
                database.ref('admin_session').remove();
                currentSessionKey = null;
            }
        }

        function forceLogout(message) {
            isLoggedIn = false;
            localStorage.removeItem('tntt_admin_logged_in');
            
            const status = document.getElementById('loginStatus');
            status.textContent = '⚠️ ' + message;
            status.className = 'status-message error';
            playMemeSound('error');
            
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('adminPanel').classList.remove('active');
            document.getElementById('password').value = '';
        }

        // ========== MEME SOUNDS ==========
        let audioCtx = null;
        let soundEnabled = true;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playTone(freq, volume, type, duration, endFreq = null) {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = type;
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            if (endFreq) {
                osc.frequency.exponentialRampToValueAtTime(endFreq, audioCtx.currentTime + duration);
            }
            gain.gain.setValueAtTime(volume, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function playMemeSound(type = 'click') {
            if (!soundEnabled) return;
            try {
                initAudio();
                switch(type) {
                    case 'login':
                        playTone(200, 0.3, 'sine', 0.3, 600);
                        setTimeout(() => playTone(400, 0.3, 'sine', 0.3, 800), 300);
                        setTimeout(() => playTone(600, 0.3, 'sine', 0.3, 1000), 600);
                        break;
                    case 'hover':
                        playTone(1200, 0.08, 'sine', 0.06);
                        break;
                    case 'focus':
                        playTone(500, 0.15, 'sine', 0.1, 800);
                        break;
                    case 'type':
                        playTone(300, 0.05, 'square', 0.03);
                        break;
                    case 'click':
                        playTone(700, 0.2, 'sine', 0.1, 900);
                        break;
                    case 'save':
                        [400, 500, 600, 800].forEach((freq, i) => {
                            setTimeout(() => playTone(freq, 0.3, 'sine', 0.2), i * 100);
                        });
                        break;
                    case 'delete':
                        playTone(800, 0.2, 'sawtooth', 0.3, 100);
                        break;
                    case 'error':
                        playTone(200, 0.3, 'square', 0.4, 50);
                        break;
                    case 'loading':
                        playTone(300, 0.1, 'sine', 0.1);
                        setTimeout(() => playTone(400, 0.1, 'sine', 0.1), 200);
                        setTimeout(() => playTone(500, 0.1, 'sine', 0.1), 400);
                        break;
                    default:
                        playTone(500, 0.2, 'sine', 0.15);
                }
            } catch(e) {}
        }

        // ========== ÂM THANH CHÀO MỪNG ==========
        function playWelcomeSound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                playTone(200, 0.3, 'sine', 0.4, 400);
                setTimeout(() => playTone(300, 0.3, 'sine', 0.3, 500), 400);
                setTimeout(() => playTone(400, 0.3, 'sine', 0.3, 600), 700);
                setTimeout(() => playTone(500, 0.4, 'sine', 0.5, 800), 1000);
                setTimeout(() => {
                    playTone(600, 0.3, 'sine', 0.4, 900);
                    playTone(400, 0.2, 'sine', 0.4, 700);
                    playTone(300, 0.2, 'sine', 0.4, 500);
                }, 1500);
                setTimeout(() => {
                    playTone(800, 0.4, 'sine', 0.6, 1200);
                    playTone(600, 0.3, 'sine', 0.6, 1000);
                    playTone(400, 0.2, 'sine', 0.6, 800);
                }, 2000);
                setTimeout(() => playTone(1000, 0.3, 'triangle', 0.8, 1500), 2600);
            } catch(e) {}
        }

        function showWelcomeMessage() {
            const welcomeDiv = document.createElement('div');
            welcomeDiv.className = 'welcome-overlay';
            welcomeDiv.innerHTML = `
                <div class="welcome-content">
                    <div class="welcome-icon">⚔️</div>
                    <div class="welcome-title">CHÀO MỪNG ĐẾN VỚI</div>
                    <div class="welcome-subtitle">BÌNH NGUYÊN VÔ TẬN</div>
                </div>
            `;
            document.body.appendChild(welcomeDiv);
            setTimeout(() => welcomeDiv.remove(), 2000);
        }

        // ========== VICTORY EFFECT ==========
        function playVictorySound() {
            if (!soundEnabled) return;
            try {
                initAudio();
                [523, 659, 784, 1047].forEach((freq, i) => {
                    setTimeout(() => playTone(freq, 0.4, 'sine', 0.4), i * 200);
                });
                setTimeout(() => {
                    playTone(1047, 0.5, 'sine', 0.8);
                    playTone(784, 0.3, 'sine', 0.8);
                    playTone(659, 0.3, 'sine', 0.8);
                }, 800);
            } catch(e) {}
        }

        function showVictoryMessage() {
            const victoryDiv = document.createElement('div');
            victoryDiv.className = 'victory-overlay';
            victoryDiv.innerHTML = `
                <div class="victory-content">
                    <div class="victory-icon">🏆</div>
                    <div class="victory-title">VICTORY!</div>
                    <div class="victory-subtitle">Hẹn gặp lại chiến binh!</div>
                </div>
            `;
            document.body.appendChild(victoryDiv);
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'victory-particle';
                const colors = ['#FFD700', '#FF6B6B', '#4ECDC4', '#8B5CF6', '#EC4899', '#10B981'];
                particle.style.background = colors[Math.floor(Math.random() * colors.length)];
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.setProperty('--tx', (Math.random() - 0.5) * 500 + 'px');
                particle.style.setProperty('--ty', (Math.random() - 0.5) * 500 + 'px');
                document.body.appendChild(particle);
                setTimeout(() => particle.remove(), 2000);
            }
            
            setTimeout(() => victoryDiv.remove(), 2500);
        }

        // ========== PRELOADER ==========
        function enterSite() {
            initAudio();
            playMemeSound('login');
            document.getElementById('preloader').classList.add('hidden');
            setTimeout(() => {
                document.getElementById('preloader').style.display = 'none';
            }, 800);
        }

        let loadProgress = 0;
        const loadInterval = setInterval(() => {
            loadProgress += Math.random() * 10;
            if (loadProgress > 100) loadProgress = 100;
            document.getElementById('loaderBar').style.width = loadProgress + '%';
            document.getElementById('loaderPercentage').textContent = Math.floor(loadProgress) + '%';
            if (loadProgress % 20 < 1) playMemeSound('loading');
            if (loadProgress >= 100) {
                clearInterval(loadInterval);
                playMemeSound('save');
            }
        }, 200);

        // ========== PAGE TRANSITION ==========
        function transitionToPage(e, url) {
            e.preventDefault();
            const transition = document.getElementById('pageTransition');
            transition.classList.add('active');
            playMemeSound('click');
            setTimeout(() => window.location.href = url, 1000);
        }

        // ========== CONNECTION ==========
        const connectedRef = firebase.database().ref('.info/connected');
        connectedRef.on('value', (snap) => {
            const statusElement = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                statusElement.textContent = 'Online';
                statusElement.className = 'connection-status online';
            } else {
                statusElement.textContent = 'Offline';
                statusElement.className = 'connection-status offline';
                if (isLoggedIn) {
                    logoutFromSession();
                }
            }
        });

        // ========== LOGIN ==========
        function login() {
            const pass = document.getElementById('password').value;
            const status = document.getElementById('loginStatus');
            
            if (pass === ADMIN_PASS) {
                database.ref('admin_session').once('value').then((snapshot) => {
                    const sessionData = snapshot.val();
                    
                    if (sessionData && sessionData.isLoggedIn && sessionData.key !== getSessionKey()) {
                        status.textContent = '⚠️ Đã có người đăng nhập! Chỉ một người được phép truy cập!';
                        status.className = 'status-message error';
                        playMemeSound('error');
                    } else {
                        proceedLogin();
                    }
                });
            } else {
                status.textContent = '❌ Sai mật khẩu!';
                status.className = 'status-message error';
                playMemeSound('error');
            }
        }

        function proceedLogin() {
            isLoggedIn = true;
            localStorage.setItem('tntt_admin_logged_in', 'true');
            
            loginToSession();
            
            playWelcomeSound();
            showWelcomeMessage();
            
            setTimeout(() => {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('adminPanel').classList.add('active');
                loadEvents();
                loadNews();
            }, 1500);
            
            const status = document.getElementById('loginStatus');
            status.textContent = '';
            status.className = 'status-message';
        }

        // ========== LOGOUT với VICTORY EFFECT ==========
        function logout() {
            playVictorySound();
            showVictoryMessage();
            
            setTimeout(() => {
                logoutFromSession();
                
                isLoggedIn = false;
                localStorage.removeItem('tntt_admin_logged_in');
                document.getElementById('loginBox').style.display = 'block';
                document.getElementById('adminPanel').classList.remove('active');
                document.getElementById('password').value = '';
            }, 2000);
        }

        // ========== TABS ==========
        function switchTab(tab) {
            document.getElementById('tabEvents').classList.remove('active');
            document.getElementById('tabNews').classList.remove('active');
            document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            
            document.getElementById('contentEvents').classList.remove('active');
            document.getElementById('contentNews').classList.remove('active');
            document.getElementById('content' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
            
            playMemeSound('click');
        }

        // ========== EVENTS ==========
        function previewEventImage() {
            const url = document.getElementById('eventImage').value;
            const preview = document.getElementById('eventImagePreview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
                playMemeSound('click');
            } else {
                preview.style.display = 'none';
            }
        }

        function uploadEventImage() {
            const fileInput = document.getElementById('eventImageFile');
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('eventImage').value = base64Image;
                    document.getElementById('eventImagePreview').src = base64Image;
                    document.getElementById('eventImagePreview').style.display = 'block';
                    playMemeSound('click');
                };
                reader.readAsDataURL(file);
            }
        }

        function saveEvent() {
            const name = document.getElementById('eventName').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const location = document.getElementById('eventLocation').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            const image = document.getElementById('eventImage').value.trim();
            const status = document.getElementById('eventStatus');

            if (!name || !date || !time || !location || !description) {
                status.textContent = '❌ Vui lòng điền đầy đủ!';
                status.className = 'status-message error';
                playMemeSound('error');
                return;
            }

            const eventData = {
                name, date, time, location, description,
                image: image || 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop',
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            database.ref('events').push(eventData)
                .then(() => {
                    status.textContent = '✅ Lưu thành công!';
                    status.className = 'status-message success';
                    playMemeSound('save');
                    resetEventForm();
                })
                .catch((error) => {
                    status.textContent = '❌ Lỗi: ' + error.message;
                    status.className = 'status-message error';
                    playMemeSound('error');
                });
        }

        function resetEventForm() {
            document.getElementById('eventName').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventImage').value = '';
            document.getElementById('eventImageFile').value = '';
            document.getElementById('eventImagePreview').style.display = 'none';
        }

        function loadEvents() {
            const savedEventsDiv = document.getElementById('savedEvents');
            database.ref('events').on('value', (snapshot) => {
                const events = snapshot.val();
                savedEventsDiv.innerHTML = '';
                if (!events) {
                    savedEventsDiv.innerHTML = '<p style="color: #aaa;">📭 Chưa có sự kiện.</p>';
                    return;
                }
                const eventsArray = Object.entries(events).map(([id, event]) => ({id, ...event}));
                eventsArray.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                eventsArray.forEach(event => {
                    const eventItem = document.createElement('div');
                    eventItem.className = 'list-item';
                    eventItem.onmouseenter = () => playMemeSound('hover');
                    eventItem.innerHTML = `
                        <img src="${event.image}" alt="${event.name}" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop'">
                        <div class="list-item-info">
                            <h3>${event.name}</h3>
                            <p>📅 ${formatDate(event.date)} - ⏰ ${event.time}</p>
                            <p>📍 ${event.location}</p>
                            <p>${event.description}</p>
                        </div>
                        <button class="btn-danger" onclick="deleteEvent('${event.id}')" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    savedEventsDiv.appendChild(eventItem);
                });
            });
        }

        function deleteEvent(id) {
            if (confirm('⚠️ Xóa sự kiện này?')) {
                database.ref('events/' + id).remove()
                    .then(() => playMemeSound('delete'))
                    .catch((error) => alert('❌ Lỗi: ' + error.message));
            }
        }

        // ========== NEWS ==========
        function saveNews() {
            const title = document.getElementById('newsTitle').value.trim();
            const type = document.getElementById('newsType').value;
            const link = document.getElementById('newsLink').value.trim();
            const description = document.getElementById('newsDescription').value.trim();
            const status = document.getElementById('newsStatus');

            if (!title || !link || !description) {
                status.textContent = '❌ Vui lòng điền đầy đủ!';
                status.className = 'status-message error';
                playMemeSound('error');
                return;
            }

            if (!link.includes('facebook.com') && !link.includes('fb.watch')) {
                status.textContent = '❌ Link phải là Facebook!';
                status.className = 'status-message error';
                playMemeSound('error');
                return;
            }

            const newsData = {
                title, type, link, description,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            database.ref('news').push(newsData)
                .then(() => {
                    status.textContent = '✅ Lưu thành công!';
                    status.className = 'status-message success';
                    playMemeSound('save');
                    resetNewsForm();
                })
                .catch((error) => {
                    status.textContent = '❌ Lỗi: ' + error.message;
                    status.className = 'status-message error';
                    playMemeSound('error');
                });
        }

        function resetNewsForm() {
            document.getElementById('newsTitle').value = '';
            document.getElementById('newsType').value = 'post';
            document.getElementById('newsLink').value = '';
            document.getElementById('newsDescription').value = '';
        }

        function loadNews() {
            const savedNewsDiv = document.getElementById('savedNews');
            database.ref('news').on('value', (snapshot) => {
                const news = snapshot.val();
                savedNewsDiv.innerHTML = '';
                if (!news) {
                    savedNewsDiv.innerHTML = '<p style="color: #aaa;">📭 Chưa có bản tin.</p>';
                    return;
                }
                const newsArray = Object.entries(news).map(([id, newsItem]) => ({id, ...newsItem}));
                newsArray.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                newsArray.forEach(newsItem => {
                    const newsElement = document.createElement('div');
                    newsElement.className = 'list-item';
                    newsElement.onmouseenter = () => playMemeSound('hover');
                    
                    const typeBadge = newsItem.type === 'video' 
                        ? '<span class="type-badge video">🎬 Video</span>'
                        : '<span class="type-badge post">📄 Bài viết</span>';
                    
                    const icon = newsItem.type === 'video' ? '🎬' : '📄';
                    
                    newsElement.innerHTML = `
                        <div class="list-item-icon">${icon}</div>
                        <div class="list-item-info">
                            <h3>${newsItem.title}</h3>
                            <p>${newsItem.description}</p>
                            ${typeBadge}
                            <p><a href="${newsItem.link}" target="_blank">🔗 Xem trên Facebook</a></p>
                        </div>
                        <button class="btn-danger" onclick="deleteNews('${newsItem.id}')" onmouseenter="playMemeSound('hover')">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    savedNewsDiv.appendChild(newsElement);
                });
            });
        }

        function deleteNews(id) {
            if (confirm('⚠️ Xóa bản tin này?')) {
                database.ref('news/' + id).remove()
                    .then(() => playMemeSound('delete'))
                    .catch((error) => alert('❌ Lỗi: ' + error.message));
            }
        }

        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN', {day: '2-digit', month: '2-digit', year: 'numeric'});
        }

        // ========== INIT ==========
        window.onload = function() {
            setupSingleSession();
            
            database.ref('admin_session').once('value').then((snapshot) => {
                const sessionData = snapshot.val();
                const sessionKey = getSessionKey();
                
                if (sessionData && sessionData.key === sessionKey && sessionData.isLoggedIn) {
                    isLoggedIn = true;
                    document.getElementById('loginBox').style.display = 'none';
                    document.getElementById('adminPanel').classList.add('active');
                    loadEvents();
                    loadNews();
                } else {
                    localStorage.removeItem('tntt_admin_logged_in');
                    database.ref('admin_session').remove();
                }
            });
        };

        console.log('👑 Admin Siêu Cấp - Single Session + Victory');
        console.log('🔒 Chỉ 1 người đăng nhập');
        console.log('⚔️ Đăng nhập: Bình Nguyên Vô Tận');
        console.log('🏆 Đăng xuất: Victory!');
        console.log('🔑 Mật khẩu: hoaan2024');
    </script>
</body>
