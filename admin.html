<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị sự kiện | TNTT Hòa An</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --gold: #D4AF37;
            --gold-dark: #AA8C2C;
            --black: #0a0a0a;
            --white: #ffffff;
            --gray: #1a1a1a;
            --border: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #000000, #1a1a1a);
            color: white;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 25px;
            border: 1px solid var(--border);
        }

        .header h1 {
            color: var(--gold);
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #aaa;
        }

        .login-box {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
        }

        .login-box h2 {
            color: var(--gold);
            margin-bottom: 30px;
        }

        input[type="password"],
        input[type="text"],
        input[type="date"],
        input[type="time"],
        input[type="url"],
        textarea {
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border-radius: 15px;
            border: 1px solid var(--border);
            background: #1a1a1a;
            color: white;
            font-size: 1rem;
            transition: 0.3s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
        }

        button {
            background: var(--gold);
            color: black;
            font-weight: bold;
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-size: 1rem;
            margin-top: 20px;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: #c9a832;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.4);
        }

        .event-form {
            display: none;
            background: #111;
            border: 1px solid var(--border);
            border-radius: 25px;
            padding: 40px;
            margin-top: 20px;
        }

        .event-form.active {
            display: block;
            animation: slideUp 0.5s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--gold);
            font-weight: bold;
        }

        .image-preview {
            width: 100%;
            max-height: 300px;
            object-fit: cover;
            border-radius: 15px;
            margin-top: 10px;
            display: none;
        }

        .event-list {
            margin-top: 30px;
        }

        .event-item {
            background: #111;
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
            transition: 0.3s;
        }

        .event-item:hover {
            border-color: var(--gold);
            box-shadow: 0 10px 30px rgba(212, 175, 55, 0.2);
        }

        .event-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 10px;
        }

        .event-item-info {
            flex: 1;
        }

        .event-item-info h3 {
            color: var(--gold);
            margin-bottom: 5px;
        }

        .event-item-info p {
            color: #aaa;
            font-size: 0.9rem;
            margin-bottom: 5px;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            border: none;
        }

        .delete-btn:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        .logout-btn {
            background: #333;
            color: white;
            padding: 12px 25px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 20px;
            border: none;
            transition: 0.3s;
        }

        .logout-btn:hover {
            background: #555;
        }

        .status-message {
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }

        .status-message.success {
            background: rgba(0, 255, 0, 0.1);
            border: 1px solid #00ff00;
            color: #00ff00;
            display: block;
        }

        .status-message.error {
            background: rgba(255, 0, 0, 0.1);
            border: 1px solid #ff0000;
            color: #ff0000;
            display: block;
        }

        .back-link {
            color: #aaa;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            transition: 0.3s;
        }

        .back-link:hover {
            color: var(--gold);
        }

        .button-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .connection-status {
            display: inline-block;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            margin-left: 10px;
        }

        .connection-status.online {
            background: rgba(0, 255, 0, 0.2);
            color: #00ff00;
        }

        .connection-status.offline {
            background: rgba(255, 0, 0, 0.2);
            color: #ff0000;
        }

        @media (max-width: 768px) {
            .event-item {
                flex-direction: column;
                text-align: center;
            }
            .event-item img {
                width: 100%;
                height: 200px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1><i class="fas fa-calendar-alt"></i> Quản Trị Sự Kiện</h1>
            <p>Thiếu Nhi Thánh Thể Giáo Xứ Hòa An <span class="connection-status offline" id="connectionStatus">Offline</span></p>
        </div>

        <!-- Màn hình đăng nhập -->
        <div class="login-box" id="loginBox">
            <h2><i class="fas fa-lock"></i> Đăng Nhập Admin</h2>
            <input type="password" id="password" placeholder="Nhập mật khẩu quản trị..." onkeypress="if(event.key==='Enter') login()">
            <button onclick="login()"><i class="fas fa-key"></i> Mở Khóa</button>
            <div class="status-message" id="loginStatus"></div>
        </div>

        <!-- Form thêm sự kiện -->
        <div class="event-form" id="eventForm">
            <h2 style="color: var(--gold); margin-bottom: 20px;"><i class="fas fa-plus-circle"></i> Thêm Sự Kiện Mới</h2>
            
            <div class="form-group">
                <label><i class="fas fa-heading"></i> Tên sự kiện:</label>
                <input type="text" id="eventName" placeholder="VD: Khai Giảng Năm Học Mới">
            </div>

            <div class="form-group">
                <label><i class="fas fa-calendar"></i> Ngày diễn ra:</label>
                <input type="date" id="eventDate">
            </div>

            <div class="form-group">
                <label><i class="fas fa-clock"></i> Giờ diễn ra:</label>
                <input type="time" id="eventTime">
            </div>

            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Địa điểm:</label>
                <input type="text" id="eventLocation" placeholder="VD: Nhà thờ Giáo xứ Hòa An">
            </div>

            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Mô tả chi tiết:</label>
                <textarea id="eventDescription" rows="4" placeholder="Mô tả về sự kiện..."></textarea>
            </div>

            <div class="form-group">
                <label><i class="fas fa-link"></i> Link ảnh (URL):</label>
                <input type="url" id="eventImage" placeholder="https://example.com/image.jpg" onchange="previewImage()">
                <img id="imagePreview" class="image-preview" alt="Preview">
            </div>

            <div class="form-group">
                <label><i class="fas fa-upload"></i> Hoặc tải ảnh từ máy:</label>
                <input type="file" id="eventImageFile" accept="image/*" onchange="uploadImage()">
            </div>

            <div class="button-group">
                <button onclick="saveEvent()"><i class="fas fa-save"></i> Lưu Sự Kiện</button>
                <button onclick="resetForm()" style="background: #555; color: white;"><i class="fas fa-redo"></i> Reset Form</button>
            </div>
            
            <div class="status-message" id="saveStatus"></div>
        </div>

        <!-- Danh sách sự kiện đã lưu -->
        <div class="event-list" id="eventList" style="display: none;">
            <h2 style="color: var(--gold); margin-bottom: 20px;"><i class="fas fa-list"></i> Sự Kiện Đã Lưu</h2>
            <div id="savedEvents"></div>
            <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Đăng Xuất</button>
        </div>

        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Quay lại trang chính</a>
    </div>

    <script>
        // ========== FIREBASE CONFIG CỦA BẠN ==========
        const firebaseConfig = {
            apiKey: "AIzaSyATNeLyDKlyeZgpJ0NdtmraAaOq6F8CrrA",
            authDomain: "tntthoaan2.firebaseapp.com",
            databaseURL: "https://tntthoaan2-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "tntthoaan2",
            storageBucket: "tntthoaan2.firebasestorage.app",
            messagingSenderId: "643181042469",
            appId: "1:643181042469:web:f31dd1c3be290477fc98cc"
        };

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        const ADMIN_PASS = "hoaan2024";
        let isLoggedIn = false;

        // Kiểm tra kết nối
        const connectedRef = firebase.database().ref('.info/connected');
        connectedRef.on('value', (snap) => {
            const statusElement = document.getElementById('connectionStatus');
            if (snap.val() === true) {
                statusElement.textContent = 'Online';
                statusElement.className = 'connection-status online';
            } else {
                statusElement.textContent = 'Offline';
                statusElement.className = 'connection-status offline';
            }
        });

        // Đăng nhập
        function login() {
            const pass = document.getElementById('password').value;
            const status = document.getElementById('loginStatus');
            
            if (pass === ADMIN_PASS) {
                isLoggedIn = true;
                localStorage.setItem('tntt_admin_logged_in', 'true');
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('eventForm').classList.add('active');
                document.getElementById('eventList').style.display = 'block';
                loadEvents();
                status.textContent = '';
                status.className = 'status-message';
                playSuccessSound();
            } else {
                status.textContent = '❌ Sai mật khẩu! Vui lòng thử lại.';
                status.className = 'status-message error';
                playErrorSound();
            }
        }

        // Đăng xuất
        function logout() {
            isLoggedIn = false;
            localStorage.removeItem('tntt_admin_logged_in');
            document.getElementById('loginBox').style.display = 'block';
            document.getElementById('eventForm').classList.remove('active');
            document.getElementById('eventList').style.display = 'none';
            document.getElementById('password').value = '';
        }

        // Preview ảnh từ URL
        function previewImage() {
            const url = document.getElementById('eventImage').value;
            const preview = document.getElementById('imagePreview');
            if (url) {
                preview.src = url;
                preview.style.display = 'block';
            } else {
                preview.style.display = 'none';
            }
        }

        // Upload ảnh từ máy và chuyển thành base64
        function uploadImage() {
            const fileInput = document.getElementById('eventImageFile');
            const file = fileInput.files[0];
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const base64Image = e.target.result;
                    document.getElementById('eventImage').value = base64Image;
                    document.getElementById('imagePreview').src = base64Image;
                    document.getElementById('imagePreview').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        }

        // Lưu sự kiện vào Firebase
        function saveEvent() {
            const name = document.getElementById('eventName').value.trim();
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const location = document.getElementById('eventLocation').value.trim();
            const description = document.getElementById('eventDescription').value.trim();
            const image = document.getElementById('eventImage').value.trim();
            const status = document.getElementById('saveStatus');

            if (!name || !date || !time || !location || !description) {
                status.textContent = '❌ Vui lòng điền đầy đủ thông tin bắt buộc!';
                status.className = 'status-message error';
                playErrorSound();
                return;
            }

            const eventData = {
                name: name,
                date: date,
                time: time,
                location: location,
                description: description,
                image: image || 'https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop',
                createdAt: firebase.database.ServerValue.TIMESTAMP
            };

            // Lưu vào Firebase
            database.ref('events').push(eventData)
                .then(() => {
                    status.textContent = '✅ Sự kiện đã được lưu thành công!';
                    status.className = 'status-message success';
                    playSuccessSound();
                    resetForm();
                })
                .catch((error) => {
                    status.textContent = '❌ Lỗi khi lưu: ' + error.message;
                    status.className = 'status-message error';
                    playErrorSound();
                });
        }

        // Reset form
        function resetForm() {
            document.getElementById('eventName').value = '';
            document.getElementById('eventDate').value = '';
            document.getElementById('eventTime').value = '';
            document.getElementById('eventLocation').value = '';
            document.getElementById('eventDescription').value = '';
            document.getElementById('eventImage').value = '';
            document.getElementById('eventImageFile').value = '';
            document.getElementById('imagePreview').style.display = 'none';
        }

        // Load danh sách sự kiện từ Firebase (Real-time)
        function loadEvents() {
            const savedEventsDiv = document.getElementById('savedEvents');
            
            database.ref('events').on('value', (snapshot) => {
                const events = snapshot.val();
                savedEventsDiv.innerHTML = '';
                
                if (!events) {
                    savedEventsDiv.innerHTML = '<p style="color: #aaa; text-align: center; padding: 20px;">📭 Chưa có sự kiện nào được lưu.</p>';
                    return;
                }

                // Chuyển object thành array
                const eventsArray = Object.entries(events).map(([id, event]) => ({
                    id: id,
                    ...event
                }));

                // Sắp xếp theo ngày tạo (mới nhất trước)
                eventsArray.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

                eventsArray.forEach(event => {
                    const eventItem = document.createElement('div');
                    eventItem.className = 'event-item';
                    eventItem.innerHTML = `
                        <img src="${event.image}" alt="${event.name}" onerror="this.src='https://images.unsplash.com/photo-1506905925346-21bda4d32df4?q=80&w=2070&auto=format&fit=crop'">
                        <div class="event-item-info">
                            <h3>${event.name}</h3>
                            <p><i class="fas fa-calendar"></i> ${formatDate(event.date)} - <i class="fas fa-clock"></i> ${event.time}</p>
                            <p><i class="fas fa-map-marker-alt"></i> ${event.location}</p>
                            <p>${event.description}</p>
                        </div>
                        <button class="delete-btn" onclick="deleteEvent('${event.id}')" title="Xóa sự kiện">
                            <i class="fas fa-trash"></i>
                        </button>
                    `;
                    savedEventsDiv.appendChild(eventItem);
                });
            });
        }

        // Xóa sự kiện từ Firebase
        function deleteEvent(id) {
            if (confirm('⚠️ Bạn có chắc muốn xóa sự kiện này?')) {
                database.ref('events/' + id).remove()
                    .then(() => {
                        playDeleteSound();
                    })
                    .catch((error) => {
                        alert('❌ Lỗi khi xóa: ' + error.message);
                    });
            }
        }

        // Format ngày
        function formatDate(dateString) {
            const date = new Date(dateString);
            return date.toLocaleDateString('vi-VN', { 
                day: '2-digit', 
                month: '2-digit', 
                year: 'numeric' 
            });
        }

        // Âm thanh
        function playSuccessSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) {}
        }

        function playErrorSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'square';
                osc.frequency.setValueAtTime(200, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            } catch(e) {}
        }

        function playDeleteSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }

        // Kiểm tra đăng nhập khi tải trang
        window.onload = function() {
            if (localStorage.getItem('tntt_admin_logged_in') === 'true') {
                isLoggedIn = true;
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('eventForm').classList.add('active');
                document.getElementById('eventList').style.display = 'block';
                loadEvents();
            }
        };
    </script>
</body>
</html>
